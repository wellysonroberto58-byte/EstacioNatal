<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Acesse sua conta informando seu e-mail ou CPF e senha."
    />
    <title>Entrar</title>
    <link rel="stylesheet" href="Style/login.css" />
    <script src="Script/login.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="login-card" aria-labelledby="page-title">
        <a
          class="brand"
          href="../cadastro/cadastro.html"
          aria-label="Estácio Natal - início"
        >
          <img class="brand-mark" src="../assets/Logo.svg" alt="" aria-hidden="true" />
          <span>Estácio<span class="brand-accent">Natal</span></span>
        </a>

        <header class="form-header">
          <p class="eyebrow">Que bom ver você de novo</p>
          <h1 id="page-title">Acesse sua conta</h1>
          <p>Informe seus dados para continuar.</p>
        </header>

        <!-- O acesso informa erros de validação e de autenticação neste formulário. -->
        <form class="login-form">
          <div class="field">
            <label for="identifier">E-mail ou CPF</label>
            <input
              id="identifier"
              name="identifier"
              type="text"
              autocomplete="username"
              placeholder="Digite seu e-mail ou CPF"
              required
            />
          </div>

          <div class="field">
            <label for="password">Senha</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Digite sua senha"
              required
            />
          </div>

          <div class="login-links">
            <a class="text-link" href="#login-message" id="forgot-password">
              Esqueci minha senha
            </a>
          </div>

          <button class="button button-primary" type="submit">
            Confirmar acesso
          </button>
          <p
            class="form-message"
            id="login-message"
            role="status"
            aria-live="polite"
            hidden
          ></p>
        </form>

        <p class="login-footer">
          Ainda não tem uma conta?
          <a href="../cadastro/cadastro.html">Cadastre-se</a>
        </p>
      </section>
    </main>

    <div class="overlay-login" id="overlay-login">
      <div class="mensagem-erro" id="mensagem-erro">
        <p id="texto-mensagem"></p>
      </div>
    </div>
  </body>
</html>
