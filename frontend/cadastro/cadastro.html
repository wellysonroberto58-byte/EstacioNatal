<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Crie sua conta preenchendo seus dados pessoais."
    />
    <title>Novo cadastro</title>
    <link rel="stylesheet" href="Style/cadastro.css" />
    <script src="Script/cadastro.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="signup-card" aria-labelledby="page-title">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">E</span>
          <span>Estácio<span class="brand-accent">Natal</span></span>
        </div>

        <header class="form-header">
          <p class="eyebrow">É bom ter você por aqui</p>
          <h1 id="page-title">Crie sua conta</h1>
          <p>Preencha seus dados para finalizar o cadastro.</p>
        </header>

        <form class="signup-form">
          <div class="field">
            <label for="name">Nome completo</label>
            <input
              id="name"
              name="name"
              type="text"
              autocomplete="name"
              placeholder="Digite seu nome completo"
              required
            />
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="voce@exemplo.com"
              required
            />
          </div>

          <div class="field-agrupada">
            <div class="field">
              <label for="placa">Placa</label>
              <input
                id="placa"
                name="placa"
                type="text"
                inputmode="text"
                autocomplete="off"
                placeholder="NEU-6723"
                title="Informe a placa do automóvel"
                maxlength="14"
                aria-describedby="placa-hint"
                required
              />
              <small id="cpf-hint">Digite a placa com traço.</small>
            </div>

            <div class="field">
              <label for="cpf">CPF</label>
              <input
                id="cpf"
                name="cpf"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="000.000.000-00"
                pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                title="Informe o CPF no formato 000.000.000-00"
                maxlength="14"
                aria-describedby="cpf-hint"
                required
              />
              <small id="cpf-hint">Digite os números com pontos e traço.</small>
            </div>
          </div>

          <div class="field">
            <label for="password">Senha</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="Crie uma senha"
              minlength="8"
              aria-describedby="password-hint"
              required
            />
            <small id="password-hint">Use pelo menos 8 caracteres.</small>
          </div>

          <div class="field">
            <label for="confirm-password">Confirmar senha</label>
            <input
              id="confirm-password"
              name="confirm-password"
              type="password"
              autocomplete="new-password"
              placeholder="Digite sua senha novamente"
              required
            />
          </div>

          <div class="form-actions">
            <button class="button button-secondary" type="reset">
              Cancelar
            </button>
            <button class="button button-primary" type="submit">
              Finalizar cadastro
            </button>
          </div>
          <p class="form-message" role="status" aria-live="polite" hidden></p>
        </form>
      </section>
    </main>
  </body>
</html>
