<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro Administrador | EstacioNatal</title>
    <link rel="stylesheet" href="./styles/cadastro-admin.css">
</head>

<body>

    <main>

        <h1>EstacioNatal</h1>

        <h2>Cadastro de Administrador</h2>

        <p>Preencha os dados para criar sua conta administrativa.</p>

        <form id="cadastro-admin-form">

            <div>
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
            </div>

            <div>
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>

            <div>
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="Digite seu CPF" required>
            </div>

            <div>
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha" required>
            </div>

            <div>
                <label for="confirmar-senha">Confirmar senha</label>
                <input type="password" id="confirmar-senha" placeholder="Digite a senha novamente" required>
            </div>

            <button type="submit" id="cadastro-button">
                Cadastrar
            </button>

            <p id="cadastro-message"></p>

        </form>

        <p>
            Já possui uma conta?
            <a href="../LoginAdministrador/login-admin.html">Faça login</a>
        </p>

    </main>

    <script src="./scripts/cadastro-admin.js"></script>

</body>

</html>
